x-finbot-data-job: &finbot-data-job
    build: .
    image: finbot-data:local
    environment:
      NASDAQ_DATA_LINK_API_KEY: ${NASDAQ_DATA_LINK_API_KEY:-}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      FINBOT_DATA_ROOT: /data
      FINBOT_RAW_BARS_DIR: /data/market/daily_bars
      FINBOT_REFERENCE_DIR: /data/reference
      FINBOT_FUNDAMENTALS_DIR: /data/fundamentals
      FINBOT_RAW_EXPORT_DIR: /data/raw/nasdaq_data_link/sharadar/sep
      FINBOT_RAW_FUNDAMENTALS_EXPORT_DIR: /data/raw/nasdaq_data_link/sharadar/sf1
      FINBOT_RAW_DAILY_VALUATION_METRICS_EXPORT_DIR: /data/raw/nasdaq_data_link/sharadar/daily
    volumes:
      - ${FINBOT_HOST_DATA_ROOT:-./data}:/data

services:
  finbot-data:
    <<: *finbot-data-job
    entrypoint: ["python", "scripts/docker_entrypoint.py", "python", "scripts/download_historical_prices.py"]
    command: ["--help"]

  finbot-ticker-universe:
    <<: *finbot-data-job
    entrypoint: ["python", "scripts/docker_entrypoint.py", "python", "scripts/download_ticker_universe.py"]

  finbot-historical-prices:
    <<: *finbot-data-job
    entrypoint: ["python", "scripts/docker_entrypoint.py", "python", "scripts/download_historical_prices.py"]

  finbot-update-historical-prices:
    <<: *finbot-data-job
    entrypoint: ["python", "scripts/docker_entrypoint.py", "python", "scripts/update_historical_prices.py"]

  finbot-fundamentals:
    <<: *finbot-data-job
    entrypoint: ["python", "scripts/docker_entrypoint.py", "python", "scripts/download_fundamentals.py"]

  finbot-update-fundamentals:
    <<: *finbot-data-job
    entrypoint: ["python", "scripts/docker_entrypoint.py", "python", "scripts/update_fundamentals.py"]

  finbot-daily-valuation-metrics:
    <<: *finbot-data-job
    entrypoint: ["python", "scripts/docker_entrypoint.py", "python", "scripts/download_daily_valuation_metrics.py"]

  finbot-update-daily-valuation-metrics:
    <<: *finbot-data-job
    entrypoint: ["python", "scripts/docker_entrypoint.py", "python", "scripts/update_daily_valuation_metrics.py"]
